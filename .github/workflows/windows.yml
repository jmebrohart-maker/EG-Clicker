name: Windows

on:
  push:
    branches: [main]
    paths: ['windows/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Windows version tag to package
        required: true
        default: windows-v3.1.0
        type: string
      publish:
        description: Publish a Windows preview release after validation
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Native Windows tests, setup, and install/uninstall
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && inputs.tag || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install hash-locked build dependencies
        run: python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r windows/requirements-build.lock
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          Get-ChildItem windows/scripts/*.ps1 | ForEach-Object {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if($errors.Count){$errors | Format-List; throw 'PowerShell parse error'}
          }
      - name: Native Windows tests including GUI controls
        run: python -m unittest discover -s windows/tests -v
      - name: Verify source checksums
        run: python scripts/verify_manifest.py
      - name: Build self-contained executable and one-click setup
        shell: pwsh
        run: |
          if(-not(Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")){
            choco install nsis --yes --no-progress
            if($LASTEXITCODE -ne 0){throw 'NSIS installation failed'}
          }
          & windows/scripts/build.ps1
      - name: Install, check frozen runtime, and uninstall
        shell: pwsh
        run: '& windows/scripts/smoke-test.ps1'
      - name: Upload installer, portable app, and checksums
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: eg-clicker-windows
          retention-days: 7
          path: |
            windows/dist/EG-Clicker-Windows-Setup-*.exe
            windows/dist/EG-Clicker-Windows-Portable-*.zip
            windows/dist/SHA256SUMS-Windows.txt

  publish:
    name: Publish verified Windows preview
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      EG_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: eg-clicker-windows
          path: windows/dist
      - name: Verify packages and version tag
        run: |
          test "$EG_TAG" = windows-v3.1.0
          cd windows/dist
          sha256sum --check SHA256SUMS-Windows.txt
      - name: Create or update a draft preview
        run: |
          if ! gh release view "$EG_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$EG_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease --title 'EG-Clicker for Windows 3.1.0 — Preview' --notes-file windows/RELEASE-NOTES.md
          fi
          test "$(gh release view "$EG_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = true
          gh release upload "$EG_TAG" --repo "$GITHUB_REPOSITORY" --clobber windows/dist/*.exe windows/dist/*.zip windows/dist/SHA256SUMS-Windows.txt
      - name: Verify uploaded files and publish
        run: |
          mkdir -p "$RUNNER_TEMP/windows-release-check"
          gh release download "$EG_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/windows-release-check"
          cmp windows/dist/SHA256SUMS-Windows.txt "$RUNNER_TEMP/windows-release-check/SHA256SUMS-Windows.txt"
          cd "$RUNNER_TEMP/windows-release-check"
          sha256sum --check SHA256SUMS-Windows.txt
          gh release edit "$EG_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
